name: Customization policy

on:
  push:
    branches:
      - 'custom/**'
  pull_request:
    branches:
      - 'custom/main'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Verify official mirror and attributed custom delta
        run: node scripts/verify-customization-policy.mjs --base origin/master --require-official-mirror
