name: Customization policy

on:
  push:
    branches:
      - 'custom/**'
  pull_request:
    branches:
      - 'custom/main'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify attributed custom delta
        run: node scripts/verify-customization-policy.mjs --base origin/master
