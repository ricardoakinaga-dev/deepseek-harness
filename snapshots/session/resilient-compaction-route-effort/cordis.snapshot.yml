# Keyless counterpart: the replay route offers only `high`, so the policy's
# per-route `off` selection fails before the adapter.

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek-api-key'
  disabled: true

- id: session-persistence-jsonl
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: none

- id: compaction-basic
  name: '@deepseek-ai/dsh-compaction-basic'
  config:
    thresholdRatio: 0.8
    headroomTokens: 1800
    retainTokens: 20
    maxTokens: 32

- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
                contextWindow: 8382
                defaultMaxTokens: 1000
                reasoningEfforts: [high]
    - id: compaction-resilience-policy
      name: '@deepseek-ai/dsh-compaction-resilience-policy'
      config:
        compactionReasoningEffortByRoute:
          deepseek-official: 'off'
        requestPreflight: false
