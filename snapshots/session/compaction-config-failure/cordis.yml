# Proactive compaction whose summary route has no adapter: the first failure
# suspends step-pressure compaction for the routed target until the turn ends.

- id: llm-deepseek
  config:
    models:
      - id: deepseek-v4-flash
        contextWindow: 8382
        maxTokens: 1000

- id: compaction-basic
  config:
    thresholdRatio: 0.8
    headroomTokens: 1800
    retainTokens: 20
    maxTokens: 32
    summarizationProvider: unconfigured-summarizer
    summarizationModel: unconfigured-model
