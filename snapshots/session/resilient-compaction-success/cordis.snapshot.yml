# With 1,850 tokens of headroom, a 1,000-token output reservation lowers the
# trigger from 7,600 to 6,650, between the history and its condensed replacement.

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek-api-key'
  disabled: true

- id: session-persistence-jsonl
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: none

- id: compaction-basic
  name: '@deepseek-ai/dsh-compaction-basic'
  config:
    thresholdRatio: 0.8
    headroomTokens: 1850
    retainTokens: 20
    maxTokens: 32

- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
                contextWindow: 9500
                defaultMaxTokens: 1000

# The opt-in resilient-compaction bundle policy with its shipped defaults.
# This authored scenario uses local replay, not a live-provider acceptance run.
- insert:
    - id: compaction-resilience-policy
      name: '@deepseek-ai/dsh-compaction-resilience-policy'
      config:
        compactionMaxTokens: 4096
        compactionTimeoutMs: 480000
        requestPreflight: true
        requestSafetyMarginTokens: 256
        requestOutputReserveTokens: 1024

- id: plugin-package-inventory-deepseek
  disabled: true
