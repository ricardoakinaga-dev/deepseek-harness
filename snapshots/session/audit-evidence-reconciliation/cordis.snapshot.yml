# Replay the recorded local model turns through the shipped headless profile.
- id: llm-deepseek
  disabled: true

- id: typert-loader
  disabled: true

- id: typert
  disabled: true

- id: typert-gateway
  disabled: true

- insert:
    - id: audit-root-env
      name: ./audit-root-env.mjs

- id: llm-pi-ai
  disabled: true

- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: llama-cpp
            name: Local llama.cpp
            models:
              - id: local-llm
                contextWindow: 32768
                defaultMaxTokens: 8192
